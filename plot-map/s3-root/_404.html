<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Demo not available · Build91</title>
  <!-- Served by CloudFront for ANY missing path on re.build91.in (S3 answers 403/404 for a key
       that doesn't exist, e.g. an unpublished project). It is shown at whatever URL was asked
       for, so it must be fully self-contained: no relative links, no external assets. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0c0d11; color: #eef0f4;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; margin: 24px; padding: 28px 30px; text-align: center;
      background: linear-gradient(180deg, #171a22, #111319); border: 1px solid #2a2f3a; border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.55); }
    .mark { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(212,175,55,.14); color: #d4af37; font-weight: 800; letter-spacing: .5px; }
    h1 { margin: 0 0 8px; font-size: 19px; }
    p { margin: 0; color: #9aa5b1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">B91</div>
    <h1>This demo isn't available</h1>
    <p>The link may be mistyped, or the project is no longer published.
      Please ask whoever shared it for an updated link.</p>
  </div>
</body>
</html>
