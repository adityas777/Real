<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Project demos · Build91</title>
  <!-- The bare site root of re.build91.in. Every published project lives in its own folder
       (re.build91.in/<project>/), so there is nothing to show here — and deliberately no list
       of projects, so one client can't browse to another's demo. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0c0d11; color: #eef0f4;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; margin: 24px; padding: 28px 30px; text-align: center;
      background: linear-gradient(180deg, #171a22, #111319); border: 1px solid #2a2f3a; border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.55); }
    .mark { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(212,175,55,.14); color: #d4af37; font-weight: 800; letter-spacing: .5px; }
    h1 { margin: 0 0 8px; font-size: 19px; }
    p { margin: 0; color: #9aa5b1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">B91</div>
    <h1>Build91 project demos</h1>
    <p>Open the project link you were given to view its interactive plot map.</p>
  </div>
</body>
</html>
